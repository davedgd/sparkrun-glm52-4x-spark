# Recipe: GLM-5.2-Int4-Int8Mix-1M-Vision (4-node)
# QuantTrio GLM-5.2 mixed INT4/INT8, TP=4 and DCP=4 across 4 DGX Spark nodes at 1M context, with vision added.

recipe_version: "1"
name: GLM-5.2-Int4-Int8Mix-4Node-1M-Vision
description: vLLM serving QuantTrio GLM-5.2-Int4-Int8Mix with TP=4 and DCP=4 across 4 DGX Spark nodes at 1M context with vision added

# The assembled model is prepared separately, not downloaded by run-recipe (see defaults below).
model: QuantTrio/GLM-5.2-Int4-Int8Mix

# Container image to use
container: gb10-glm52:v18.1-vision-sparkrun

# Can only be run in a cluster
cluster_only: true

mods:
  - mods/drop-caches

env:
  HF_HOME: /cache/huggingface

  XDG_CACHE_HOME: /cache/huggingface/jitcache
  CUDA_CACHE_PATH: /cache/huggingface/jitcache/cuda
  VLLM_CACHE_DIR: /cache/huggingface/jitcache/vllm
  VLLM_CACHE_ROOT: /cache/huggingface/jitcache/vllm
  FLASHINFER_WORKSPACE_BASE: /cache/huggingface/jitcache/flashinfer
  TRITON_CACHE_DIR: /cache/huggingface/jitcache/triton
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/jitcache/torchinductor
  TORCH_EXTENSIONS_DIR: /cache/huggingface/jitcache/torch_extensions
  TVM_FFI_CACHE_DIR: /cache/huggingface/jitcache/tvm-ffi
  CUTE_DSL_CACHE_DIR: /cache/huggingface/jitcache/cutlass_dsl
  B12X_CUTE_COMPILE_CACHE_DIR: /cache/huggingface/jitcache/b12x/cute_compile

  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  CUDA_DEVICE_MAX_CONNECTIONS: "32"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  NCCL_NVLS_ENABLE: "0"
  OMP_NUM_THREADS: 4

  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

  VLLM_DCP_SHARD_DRAFT: "1"
  VLLM_DCP_QUERY_SPLIT: "0"
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_B12X_MLA_CKV_GATHER: "0" # avoid "1" (causes intense slowdown/instability in testing both during model load and inference)
  #VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "131072"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  #NCCL_CUMEM_ENABLE: "0"

  VLLM_ADAPTIVE_SPEC_DEPTHS: "2,4,5"
  VLLM_MTP_INSTRUMENT: "1"
  VLLM_MTP_INSTRUMENT_WINDOW: "32"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.90
  max_model_len: 1048576
  max_num_seqs: 5
  max_num_batched_tokens: 4096

  composite_model_path: /cache/huggingface/glm52-quanttrio-vision
  text_model_path: /cache/huggingface/hub/models--QuantTrio--GLM-5.2-Int4-Int8Mix/snapshots/1d3bcfe5ec549ecd000fd80b37f191183842e983

command: |
  vllm serve {composite_model_path} \
    --served-model-name QuantTrio/GLM-5.2-Int4-Int8Mix QuantTrio/GLM-5.2-Int4-Int8Mix-Vision \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --quantization compressed-tensors \
    --tensor-parallel-size {tensor_parallel} \
    --decode-context-parallel-size 4 \
    --dcp-comm-backend ag_rs \
    --attention-backend B12X_MLA_SPARSE \
    --speculative-config '{"model": "/cache/huggingface/hub/models--QuantTrio--GLM-5.2-Int4-Int8Mix/snapshots/1d3bcfe5ec549ecd000fd80b37f191183842e983", "method":"mtp","num_speculative_tokens":5,"draft_attention_backend":"B12X_MLA_SPARSE","quantization":"compressed-tensors","adaptive_speculative_tokens_window":32}' \
    --kv-cache-dtype fp8_ds_mla \
    --kv-cache-memory-bytes 14400000000 \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --no-async-scheduling \
    --enable-decode-aware-prefill \
    --decode-prefill-token-budget 512 \
    --idle-prefill-token-budget 4096 \
    --max-long-prefills-per-step 1 \
    -cc.cudagraph_mode=FULL_DECODE_ONLY \
    -cc.custom_ops='["all"]' \
    --max-cudagraph-capture-size 30 \
    --long-prefill-token-threshold 2048 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --hf-overrides '{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}' \
    --limit-mm-per-prompt '{{"image":3,"video":0}}' \
    --mm-processor-cache-gb 0 \
    --mm-encoder-tp-mode weights